  - name: Thiết lập NodeJS
    uses: actions/setup-node@v4
    with:
      node-version: 20 # Sửa lỗi cú pháp node-size thành node-version chuẩn

  - name: Cài đặt thư viện phụ thuộc
    run: npm install

  - name: Biên dịch ứng dụng (Build)
    run: npm run build

  - name: Đẩy lên Firebase Hosting bằng Token
    run: npx firebase-tools deploy --token "${{ secrets.FIREBASE_TOKEN }}" --only hosting
