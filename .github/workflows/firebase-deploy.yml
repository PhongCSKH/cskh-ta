  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Frontend Dependencies
    run: npm install

  - name: Build Frontend
    run: npm run build

  - name: Install Functions Dependencies
    run: npm --prefix functions install

  # STREAMING_CHUNK: Performing native deployment to bypass Docker issues
  - name: Deploy to Firebase (Native CLI)
    run: npx firebase-tools deploy --token "${{ secrets.FIREBASE_TOKEN }}" --only hosting,functions --force
